# Cấu hình gitleaks (CI job `security`, ADR-0032). Giữ bộ luật mặc định, chỉ bỏ qua đúng hai dương tính giả
# đã xem xét: file mẫu toàn giá trị giả, và huy hiệu có token công khai trong README mẫu của NestJS.
# Thêm ngoại lệ mới phải kèm lý do ở đây.
[extend]
useDefault = true

[allowlist]
description = "Dương tính giả đã xem xét"
paths = [
  '''^\.env\.prod\.example$''',
  '''^apps/api/README\.md$''',
  # TG.2: manifest evidence ghi hash SHA-256 của từng file nguồn (không phải bí mật) nên
  # khớp nhầm luật `generic-api-key`. Chỉ miễn đúng các manifest trong evidence, không miễn
  # cả thư mục evidence.
  '''^docs/v0\.2\.0/evidence/[^/]+/source-manifest\.json$''',
]

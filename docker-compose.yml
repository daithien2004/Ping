services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ping
      POSTGRES_DB: ping
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ping']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Chỉ mở trên loopback: dev dùng được, máy khác trong LAN không vào được.
    ports: ['127.0.0.1:6333:6333', '127.0.0.1:6334:6334']
    volumes: ['qdrantdata:/qdrant/storage']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 5s
      retries: 10

  # TG.8: Mailer ở dev — Mailpit bắt SMTP (1025) và có UI/API xem thư (8025); e2e đọc token
  # từ API của nó. Staging/production dùng dịch vụ thật qua SMTP_URL, không chạy container này.
  # Không đặt healthcheck: image Alpine không có bash, healthcheck TCP kiểu khác rườm ra mà
  # không có service nào depends_on nó — compose up --wait từng đỏ oan vì "unhealthy".
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

volumes:
  pgdata:
  qdrantdata:

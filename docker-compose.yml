services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ping
      POSTGRES_DB: ping
    command:
      [
        'postgres',
        '-c',
        'hba_file=/etc/postgresql/pg_hba.conf',
        '-c',
        'wal_level=replica',
        '-c',
        'max_wal_senders=5',
        '-c',
        'listen_addresses=*',
      ]
    ports: ['5432:5432']
    volumes:
      [
        'pgdata:/var/lib/postgresql/data',
        './ops/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ping']
      interval: 5s
      retries: 10

  # ADR-0102: replica streaming chỉ đọc. Dùng bằng REPLICA_DATABASE_URL=postgresql://ping:ping@localhost:5433/ping.
  postgres-replica:
    image: postgres:17
    entrypoint: ['bash', '/replica-entrypoint.sh']
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ping
    ports: ['127.0.0.1:5433:5432']
    volumes:
      [
        'replicadata:/var/lib/postgresql/data',
        './ops/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ping']
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Chỉ mở trên loopback: dev dùng được, máy khác trong LAN không vào được.
    ports: ['127.0.0.1:6333:6333', '127.0.0.1:6334:6334']
    volumes: ['qdrantdata:/qdrant/storage']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 5s
      retries: 10

  # TG.8: Mailer ở dev — Mailpit bắt SMTP (1025) và có UI/API xem thư (8025); e2e đọc token
  # từ API của nó. Staging/production dùng dịch vụ thật qua SMTP_URL, không chạy container này.
  # Không đặt healthcheck: image Alpine không có bash, healthcheck TCP kiểu khác rườm ra mà
  # không có service nào depends_on nó — compose up --wait từng đỏ oan vì "unhealthy".
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  # ADR-0094: đường chuyển outbox → indexer. KRaft một node (không Zookeeper), heap giới hạn 512 MB cỡ VPS.
  # Chỉ mở trên loopback.
  # ADR-0099: file đính kèm nằm trong object storage tương thích S3. Console http://127.0.0.1:9001 (minioadmin/minioadmin, chỉ dev).
  # ADR-0100: nơi nhận và xem trace (bộ nhớ trong, mất khi restart). UI http://127.0.0.1:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      MEMORY_MAX_TRACES: '2000'
    ports: ['127.0.0.1:16686:16686', '127.0.0.1:4318:4318']

  minio:
    # Ảnh minio/minio không còn trên Docker Hub; bitnamilegacy là bản dừng cập nhật (chỉ dùng cho học tập và dev).
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['miniodata:/bitnami/minio/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ['127.0.0.1:9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ['kafkadata:/var/lib/kafka/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      retries: 12

volumes:
  pgdata:
  qdrantdata:
  kafkadata:
  miniodata:
  replicadata:

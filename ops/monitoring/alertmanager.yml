# Alertmanager local: nhận cảnh báo từ Prometheus và chuyển tới một webhook. Nơi nhận thật (Slack, email, PagerDuty) thuộc staging.
route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: webhook
    webhook_configs:
      - url: http://host.docker.internal:19094/alert
        send_resolved: true

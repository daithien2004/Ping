                      },
                  },
                ],
            },
          ],
      },
      {
        'name': 'Exactly 80%, no alert',
        'interval': '1m',
        'input_series':
          [
            { 'series': 'ai_daily_spent_usd{job="ping-api",instance="a"}', 'values': '8+0x5' },
            { 'series': 'ai_daily_budget_usd{job="ping-api",instance="a"}', 'values': '10+0x5' },
            { 'series': 'ai_budget_metrics_up{job="ping-api",instance="a"}', 'values': '1+0x5' },

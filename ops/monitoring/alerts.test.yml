              'eval_time': '3m',
              'alertname': 'PingAiBudgetWarning',
              'exp_alerts':
                [
                  {
                    'exp_labels': { 'job': 'ping-api', 'severity': 'ticket' },
                    'exp_annotations':
                      {
                        'summary': 'Daily AI spending is above 80% of the configured budget',

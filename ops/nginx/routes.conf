location /api/ {
    # Không thêm dấu / sau upstream: giữ nguyên tiền tố /api/v1.
    proxy_pass http://ping_api;
}

location /socket.io/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Phải lớn hơn pingInterval + pingTimeout của Socket.IO (25 s + 20 s) để Nginx không cắt kết nối còn sống.
    proxy_read_timeout 75s;
    proxy_pass http://ping_realtime;
}

location / {
    proxy_pass http://ping_web;
}

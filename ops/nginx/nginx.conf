user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Docker DNS: resolve lại khi container API/web được thay thế.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream ping_api {
        zone ping_api 64k;
        server api:4000 resolve;
        keepalive 16;
    }
    upstream ping_web {
        zone ping_web 64k;
        server web:3000 resolve;
        keepalive 16;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    map $upstream_http_x_request_id $ping_request_id {
        default $upstream_http_x_request_id;
        '' $request_id;
    }
    # Không log URL/query, cookie, token hay nội dung tin nhắn.
    log_format ping escape=json '{"requestId":"$ping_request_id","method":"$request_method","status":$status}';
    access_log /var/log/nginx/access.log ping;
    # API tự giới hạn 32 KB và trả lỗi JSON có requestId, tránh trang lỗi HTML của proxy.
    client_max_body_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    # Chỉ một proxy được tin cậy: ghi đè header người dùng có thể tự gửi.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    include /etc/nginx/conf.d/*.conf;
}

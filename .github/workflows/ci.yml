# CI của ping (ADR-0032). Chạy cho mọi PR và mọi lần push main. Tên job là tên bạn chọn làm
# "required status check" khi bật branch protection: verify, api-e2e, web-e2e-gate,
# migrations, security (web-e2e chạy shard nên gate là check tổng).
name: CI

on:
  pull_request:
  # Nhánh làm việc cũng chạy khi được đẩy lên (không cần mở PR mới thấy kết quả); main luôn chạy.
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Giá trị cho dịch vụ chạy trong job (service containers). Trùng với .env.example.
  DATABASE_URL: postgresql://ping:ping@localhost:5432/ping
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-0123456789
  WEB_ORIGIN: http://localhost:3000

jobs:
  # Lọc docs-only: commit chỉ đụng docs/*.md/LICENSE thì các job nặng (web-e2e) bỏ qua.
  # KHÔNG dùng paths-ignore ở cấp `on:` — workflow bị skip toàn bộ sẽ treo required check
  # ở trạng thái "Expected" vĩnh viễn; skip ở cấp job thì GitHub tính là đạt.
  # .github/** cố ý KHÔNG nằm trong vùng an toàn: sửa CI/Playwright cần chính run này
  # để kiểm chứng. Filter dạng đảo: file mới ở thư mục lạ mặc định là CHẠY, không bỏ sót.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bản build production của web bắt buộc có biến này (src/lib/env.ts).
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Prisma client nằm ở src/generated (git bỏ qua): phải sinh trước lint và typecheck, nếu không
      # PrismaService thiếu các model và typecheck đỏ (chỉ lộ ra trên máy sạch như CI).
      - run: cp .env.example .env
      - run: pnpm --filter api exec prisma generate
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web check:bundle

  api-e2e:
    name: api-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ping, POSTGRES_PASSWORD: ping, POSTGRES_DB: ping }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ping" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # TG.8: account-lifecycle e2e đọc token từ Mailpit API (8025) và API gửi qua SMTP (1025).
      mailpit:
        image: axllent/mailpit:v1.20
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Các spec đọc cấu hình qua ConfigModule (../../.env) và một số đọc thẳng process.env.
      - run: cp .env.example .env
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api test:e2e
        env:
          SMTP_URL: smtp://127.0.0.1:1025

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main luôn chạy đủ (mốc xanh đầy đủ); nhánh khác chỉ bỏ qua khi commit thuần docs.
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.code == 'true'
    # Shard 3 runner: mỗi shard có IP riêng (không cộng dồn rate limit 100 req/phút/IP
    # là lý do workers: 1) và Postgres/Redis riêng (không xung đột dữ liệu seed).
    # Playwright tự cân shard theo số test; nếu đo thấy lệch tải thì chia tay theo spec nặng/nhẹ.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ping, POSTGRES_PASSWORD: ping, POSTGRES_DB: ping }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ping" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # TG.8: global-setup verify seed + account.spec đọc token từ Mailpit (8025).
      mailpit:
        image: axllent/mailpit:v1.20
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @ping/shared build
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      # Spec e2e dùng tài khoản dev seed (bob/carol/alice) để không đốt rate limit
      # `POST /auth/register` (5 lượt/phút/IP) — DB dev local luôn có seed, CI phải tạo tương tự.
      # Seed idempotent (id cố định + upsert) nên chạy lại không đổi dữ liệu.
      - run: pnpm --filter api exec prisma db seed
      # Browser cache chỉ chứa Chromium; `--with-deps` vẫn chạy khi cache hit vì apt deps
      # không nằm trong ~/.cache/ms-playwright.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm --filter web exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # E2E chạy bản production (E2E_PRODUCTION=1): build web + API trong từng shard.
      # Build đo được rất rẻ (~30s tổng) nên KHÔNG dùng job build riêng + artifact
      # (.next/dist nặng hơn thời gian build; thêm chi phần upload/download/lỗi).
      - run: pnpm --filter api build
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      # Gọi `exec playwright test` trực tiếp: `pnpm run test:e2e -- --shard=...` bị pnpm
      # nuốt tham số — cả 3 shard chạy trọn bộ (run 40197080711: mỗi shard ~510–520s,
      # bằng đúng 1 run không shard), phí ×3 runner mà wall-clock không giảm.
      - run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}/${{ matrix.total-shards }}
        env:
          E2E_PRODUCTION: '1'
          # TG.8: API prod boot kế thừa env này → gửi thư thật vào Mailpit (global-setup
          # verify seed + account.spec đọc token). Thiếu → ConsoleMailer và Mailpit trống.
          SMTP_URL: smtp://127.0.0.1:1025
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # Required check tổng khi web-e2e chạy shard (tên check của shard là "web-e2e (1/3)"...).
  # Khi bật branch protection, đặt "web-e2e-gate" làm required thay vì từng shard.
  # Shard bị skip (docs-only trên nhánh) vẫn tính đạt.
  web-e2e-gate:
    name: web-e2e-gate
    needs: web-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Đạt nếu mọi shard thành công (hoặc bị skip)
        run: |
          result="${{ needs.web-e2e.result }}"
          echo "Kết quả web-e2e: $result"
          case "$result" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ping, POSTGRES_PASSWORD: ping, POSTGRES_DB: ping }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử để so với phiên bản trước
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DB trống chạy toàn bộ migration từ đầu: bắt migration hỏng hoặc thiếu.
      - run: pnpm --filter api exec prisma migrate deploy
      # Schema trong code phải khớp đúng kết quả của các migration: bắt quên tạo migration
      # (exit 2 = có khác biệt). Quy tắc 7: thay đổi DB chỉ qua migration.
      - run: pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Nâng cấp thật: DB mang schema của phiên bản trước (migration của BASE), rồi áp migration của bản này.
      # Cũng bắt việc sửa/xóa migration đã merge (quy tắc 7).
      - name: Upgrade from the previous version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git merge-base origin/main HEAD)"
          fi
          # Push đầu tiên của nhánh có `before` toàn số 0; commit không còn trong lịch sử cũng vậy.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          PGPASSWORD=ping psql -h localhost -U ping -d postgres -c "CREATE DATABASE upgrade_check"
          BASE="$BASE" DATABASE_URL=postgresql://ping:ping@localhost:5432/upgrade_check bash scripts/check-migration-upgrade.sh

  drills:
    name: drills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # Diễn tập tắt thật Postgres/Redis bằng docker (tên container theo project "ping" của compose).
      - run: docker compose up -d --wait
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter @ping/shared build
      - run: pnpm --filter api build
      - run: pnpm --filter api drill:redis
      - run: pnpm --filter api drill:postgres

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Dựng stack production qua Nginx HTTPS (CA tự ký riêng cho CI), WebSocket và SIGTERM thật.
      # dừng api phải thoát mã 0 (tắt êm), không bị SIGKILL (137).
      - name: Prepare env
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-password-ci-password"
            echo "JWT_ACCESS_SECRET=ci-only-secret-ci-only-secret-ci-only-0123456789"
            echo "PUBLIC_URL=https://localhost:8443"
            echo "BIND_ADDRESS=127.0.0.1"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "TLS_CERT_DIR=$RUNNER_TEMP/ping-certs"
          } > .env.prod
          mkdir -p "$RUNNER_TEMP/ping-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/ping-certs/privkey.pem" -out "$RUNNER_TEMP/ping-certs/fullchain.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 600 "$RUNNER_TEMP/ping-certs/privkey.pem"
      - name: Build and start the stack
        run: |
          set -o pipefail
          # -e mặc định của Actions sẽ thoát ngay khi pipeline fail; tắt tạm để kịp phát annotation.
          set +e
          docker compose -p pingprod -f docker-compose.prod.example.yml -f docker-compose.prod.tls.yml --env-file .env.prod up -d --build --wait --wait-timeout 180 2>&1 | tee compose-up.txt
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            # Log job chỉ admin đọc được; phát đuôi output của chính compose lên annotation (công khai).
            python3 -c "import re,sys; body=open('compose-up.txt',encoding='utf-8',errors='replace').read()[-3500:]; body=re.sub(r'\x1b\[[0-9;]*[a-zA-Z]','',body); print('::error title=compose up::' + re.sub(r'%','%25',re.sub(r'\r','%0D',re.sub(r'\n','%0A',body))))"
            exit "$code"
          fi
      - name: Validate Nginx configuration
        run: docker compose -p pingprod -f docker-compose.prod.example.yml -f docker-compose.prod.tls.yml --env-file .env.prod exec -T nginx nginx -t
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: HTTPS, redirect, auth and WebSocket through Nginx
        env:
          BASE_URL: https://localhost:8443
          HTTP_URL: http://localhost:8080
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/ping-certs/fullchain.pem
        run: node apps/api/test/smoke/prod-stack.mjs
      - name: Graceful shutdown on SIGTERM
        run: |
          docker compose -p pingprod -f docker-compose.prod.example.yml -f docker-compose.prod.tls.yml --env-file .env.prod stop api
          code=$(docker inspect pingprod-api-1 --format '{{.State.ExitCode}}')
          echo "api exit code: $code"
          test "$code" = "0"
      - name: Logs on failure
        if: failure()
        # Log job chỉ admin đọc được qua API; annotations để người không admin đối chiếu khi job đỏ.
        run: |
          dc="docker compose -p pingprod -f docker-compose.prod.example.yml -f docker-compose.prod.tls.yml --env-file .env.prod"
          {
            echo "--- ps ---"
            $dc ps -a
            echo "--- migrate ---"
            $dc logs --tail 20 migrate 2>&1 | tail -12
            echo "--- worker ---"
            $dc logs --tail 20 worker 2>&1 | tail -6
            echo "--- api ---"
            $dc logs --tail 20 api 2>&1 | tail -6
          } > ping-docker-logs.txt 2>&1
          cat ping-docker-logs.txt
          python3 - <<'PY'
          import re
          body = open('ping-docker-logs.txt', encoding='utf-8', errors='replace').read()[-6000:]
          print('::error title=docker job diagnostics::' + re.sub(r'%', '%25', re.sub(r'\r', '%0D', re.sub(r'\n', '%0A', body))))
          PY
      - name: Vulnerability scan (high and critical)
        # Báo cáo, chưa bắt buộc (quyết định C trong kế hoạch H6): bỏ continue-on-error khi muốn chặn.
        continue-on-error: true
        run: |
          for image in pingprod-api pingprod-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks quét cả lịch sử
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chỉ chặn lỗ hổng mức high trở lên trong dependency production.
      - run: pnpm audit --prod --audit-level=high
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Alert rules syntax and behavior (promtool)
        run: |
          docker run --rm -v "$PWD/ops:/ops:ro" --entrypoint promtool prom/prometheus:v3.15.0 check rules /ops/alerts.yml
          docker run --rm -v "$PWD/ops:/ops:ro" -w /ops/monitoring --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts.test.yml

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    # Cần API chạy thật: không có API thì /login rơi vào trang lỗi nghiêm trọng và Lighthouse đo nhầm trang đó.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ping, POSTGRES_PASSWORD: ping, POSTGRES_DB: ping }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ping" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    # Báo cáo, chưa chặn merge (quyết định B): ngưỡng cần vài lần chạy để ổn định.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build trực tiếp một gói (không qua turbo) thì không tự build @ping/shared: làm tay.
      - run: cp .env.example .env
      - run: pnpm --filter @ping/shared build
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api build
      - name: Start the API
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm --filter web build
      - name: Lighthouse CI
        run: |
          pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.json 2>&1 | tee lhci.log
          code=${PIPESTATUS[0]}
          # Log đầy đủ của job cần đăng nhập mới đọc được: đưa các kiểm tra chưa đạt lên annotation (xem công khai).
          node scripts/lhci-failures.mjs
          exit "$code"

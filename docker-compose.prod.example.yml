# Stack production mẫu (ADR-0035): nginx → web + api → postgres + redis + kafka, migration là service chạy MỘT LẦN.
# Local: docker compose -p pingprod -f docker-compose.prod.example.yml --env-file .env.prod up -d --build
# VPS: GitHub Actions publish image lên GHCR rồi chạy compose không có --build.
# Một domain duy nhất: Nginx đưa /api và /socket.io về api, còn lại về web. Cùng origin nên cookie refresh
# và CSP (connect-src 'self') chạy đúng, không cần CORS hay tên miền phụ.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ping
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ping']
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Qdrant chỉ nằm trong mạng compose, KHÔNG publish cổng ra ngoài (T5.2).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: ['qdrantdata:/qdrant/storage']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Migration tách khỏi API: chạy xong (thành công) thì api mới khởi động. Không để mọi instance tự migrate.
  migrate:
    image: ghcr.io/${GHCR_OWNER}/ping-migrate:${IMAGE_TAG}
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://ping:${POSTGRES_PASSWORD}@postgres:5432/ping
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # ADR-0094: đường chuyển outbox → indexer. Chỉ nằm trong mạng compose, KHÔNG publish cổng. KRaft một node,
  # heap giới hạn vì VPS 4 GB RAM. Nếu Kafka chết, tin vẫn lưu và phát realtime; event outbox chờ rồi được phát lại.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ['kafkadata:/var/lib/kafka/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # ADR-0097: hai bản sao API là HAI service có cùng alias mạng `api` (Nginx `server api:4000 resolve` nhận cả hai IP, không sticky).
  # Tách service thay vì `deploy.replicas` để deploy.sh cập nhật tuần tự: `compose up` thay mọi bản sao của một service cùng lúc.
  # Ngân sách Postgres: số bản sao × PG_POOL_MAX (+ worker) < max_connections. Thêm bản sao: thêm service `api-3` như `api-2`.
  api-1: &api-service
    image: ghcr.io/${GHCR_OWNER}/ping-api:${IMAGE_TAG}
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runner }
    environment: &api-environment
      NODE_ENV: production
      ATTACHMENT_STORAGE_DIR: /app/uploads
      ATTACHMENT_USER_QUOTA_BYTES: ${ATTACHMENT_USER_QUOTA_BYTES:-104857600}
      ATTACHMENT_SERVER_QUOTA_BYTES: ${ATTACHMENT_SERVER_QUOTA_BYTES:-1073741824}
      PORT: 4000
      DATABASE_URL: postgresql://ping:${POSTGRES_PASSWORD}@postgres:5432/ping
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      WEB_ORIGIN: ${PUBLIC_URL}
      TRUST_PROXY: 1 # một proxy (Nginx) đứng trước: req.ip là IP thật, rate limit theo IP đúng
      SHUTDOWN_GRACE_MS: 10000
      SHUTDOWN_TIMEOUT_MS: 25000
      SENTRY_DSN: ${SENTRY_DSN:-}
      QDRANT_URL: http://qdrant:6333
      KAFKA_BROKERS: kafka:9092
      REALTIME_ROLE: api # ADR-0098: API không giữ socket; service realtime giữ kết nối
      # METRICS_PORT cố ý không đặt: đặt thì chỉ mở trong mạng nội bộ của compose, KHÔNG publish ra ngoài.
    volumes: ['uploads:/app/uploads']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      default:
        aliases: [api]
    stop_grace_period: 40s # > SHUTDOWN_GRACE_MS + SHUTDOWN_TIMEOUT_MS thì docker mới không SIGKILL giữa chừng
    restart: unless-stopped

  api-2:
    <<: *api-service

  # ADR-0098: service Realtime giữ kết nối WebSocket (cùng image, entrypoint khác). Một bản vì RAM VPS; thêm `realtime-2` như `api-2`
  # (alias `realtime`) để thay từng bản mà không rớt hết socket. API phát tới đây qua Redis adapter.
  realtime-1:
    image: ghcr.io/${GHCR_OWNER}/ping-api:${IMAGE_TAG}
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runner }
    command: ['node', 'dist/realtime.js']
    environment:
      <<: *api-environment
      REALTIME_ROLE: gateway
    networks:
      default:
        aliases: [realtime]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 40s
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER}/ping-api:${IMAGE_TAG}
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runner }
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-environment
      # Healthcheck thật (compose --wait coi service không có healthcheck là lỗi): worker mở
      # cổng metrics nội bộ (ADR-0031), không publish ra ngoài; cổng 4000 của image không dùng.
      METRICS_PORT: 4001
    volumes: ['uploads:/app/uploads']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/metrics').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/ping-web:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL} # cùng origin với web (Nginx định tuyến /api)
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80']
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      NGINX_ENVSUBST_FILTER: '^PUBLIC_URL$$'
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx:/etc/nginx/ping:ro
      - ./ops/nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [api-1, api-2, realtime-1, web]
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  kafkadata:
  uploads:

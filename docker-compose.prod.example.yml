# Stack production mẫu (ADR-0032): caddy → web + api → postgres + redis, migration là service chạy MỘT LẦN.
# Dùng:  cp .env.prod.example .env.prod  (điền giá trị thật)
#        docker compose -f docker-compose.prod.example.yml --env-file .env.prod up -d --build
# Một domain duy nhất: Caddy đưa /api và /socket.io về api, còn lại về web. Cùng origin nên cookie refresh
# và CSP (connect-src 'self') chạy đúng, không cần CORS hay tên miền phụ.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ping
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ping']
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Migration tách khỏi API: chạy xong (thành công) thì api mới khởi động. Không để mọi instance tự migrate.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://ping:${POSTGRES_PASSWORD}@postgres:5432/ping
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runner }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ping:${POSTGRES_PASSWORD}@postgres:5432/ping
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      WEB_ORIGIN: ${PUBLIC_URL}
      TRUST_PROXY: 1 # một proxy (Caddy) đứng trước: req.ip là IP thật, rate limit theo IP đúng
      SHUTDOWN_GRACE_MS: 10000
      SHUTDOWN_TIMEOUT_MS: 25000
      SENTRY_DSN: ${SENTRY_DSN:-}
      # METRICS_PORT cố ý không đặt: đặt thì chỉ mở trong mạng nội bộ của compose, KHÔNG publish ra ngoài.
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 40s # > SHUTDOWN_GRACE_MS + SHUTDOWN_TIMEOUT_MS thì docker mới không SIGKILL giữa chừng
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL} # cùng origin với web (Caddy định tuyến /api)
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
